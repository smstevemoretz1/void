# This is a GitHub Actions workflow to build the Void editor for macOS (Intel).
# It has been updated based on the official build documentation.

name: Build Void for macOS (Intel)

# Controls when the action will run.
on:
  # Triggers the workflow on push events for all branches
  push:
    branches: [ '**' ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-macos-intel:
    # The type of runner that the job will run on.
    # Using macos-13 as it is the latest supported standard runner with an Intel (x64) architecture.
    # macos-12 is deprecated, causing long queue times.
    # macos-14 standard runners are ARM64 (Apple Silicon).
    runs-on: macos-13

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Node.js using the exact version from the .nvmrc file (as per docs)
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Install libtool (GNU libtool) to prevent build errors on macOS (as per docs)
      - name: Install macOS Prerequisites
        run: brew install libtool

      # Installs project dependencies
      - name: "Install Dependencies"
        run: npm install

      # Packages the application using the official gulp task for Intel Macs
      - name: Package macOS Application (Intel)
        run: npm run gulp vscode-darwin-x64

      # Uploads the built application folder as a workflow artifact
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void-macOS-Intel-App
          path: ../VSCode-darwin-x64/
