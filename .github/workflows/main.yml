# This is a GitHub Actions workflow to build the Void editor for macOS (Intel).
# It now creates a compressed .dmg file to produce a small, distributable artifact.

name: Build Void for macOS (Intel)

# Controls when the action will run.
on:
  # Triggers the workflow on push events for all branches
  push:
    branches: [ '**' ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-macos-intel:
    # The type of runner that the job will run on.
    # Using macos-13 as it is the latest supported standard runner with an Intel (x64) architecture.
    runs-on: macos-13

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Node.js using the exact version from the .nvmrc file (as per docs)
      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Install libtool (GNU libtool) and create-dmg for packaging
      - name: Install macOS Prerequisites
        run: |
          brew install libtool
          brew install create-dmg

      # Installs project dependencies, providing a GitHub token to avoid rate-limiting issues
      - name: "Install Dependencies"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install

      # Build the React components first, as they are a dependency for the main compilation
      - name: Build React Components
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run buildreact

      # Run the gulp task to create the unminified application bundle
      - name: Build macOS Application (Intel)
        run: npm run gulp vscode-darwin-x64

      # Move the built application into the current directory to simplify paths
      - name: Move Application for Packaging
        run: mv ../VSCode-darwin-x64 .

      # Create a highly compressed .dmg from the application bundle, with a retry loop
      - name: Create DMG Artifact
        run: |
          set -x
          max_tries=30
          i=0
          until create-dmg \
            --format UDBZ \
            --volname "Void Installer" \
            --window-size 660 400 \
            --icon-size 160 \
            --icon "Void.app" 180 170 \
            --hide-extension "Void.app" \
            --app-drop-link 480 170 \
            "Void-macOS-Intel.dmg" \
            "VSCode-darwin-x64/Void.app"
          do
            if [ $i -eq $max_tries ]
            then
              echo "Error: create-dmg did not succeed even after $max_tries tries."
              exit 1
            fi
            i=$((i+1))
            sleep 5
          done
      
      # Uploads the final .dmg file as a workflow artifact
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void-macOS-Intel
          path: Void-macOS-Intel.dmg
